services:
  postgres:
    image: postgres:16-alpine
    container_name: concord-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: concord
      POSTGRES_USER: concord
      POSTGRES_PASSWORD: ${DB_PASSWORD:-concord}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    labels:
      logging: concord
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concord -d concord"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: concord-redis
    restart: unless-stopped
    labels:
      logging: concord
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - default

  app:
    build:
      context: ./docker/php
    image: concord-php:latest
    container_name: concord-app
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php-custom.ini:/usr/local/etc/php/conf.d/zz-concord.ini:ro
    environment:
      APP_ENV: production
    labels:
      logging: concord
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default

  queue:
    image: concord-php:latest
    container_name: concord-queue
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=120
    labels:
      logging: concord
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default

  scheduler:
    image: concord-php:latest
    container_name: concord-scheduler
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    command: php artisan schedule:work
    labels:
      logging: concord
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default

  nginx:
    image: nginx:1.27-alpine
    container_name: concord-nginx
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html:ro
      - ./frontend/dist:/var/www/frontend:ro
      - ./docker/nginx/00-json-log.conf:/etc/nginx/conf.d/00-json-log.conf:ro
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    labels:
      - logging=concord
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.concord.rule=Host(`${APP_DOMAIN:-c.2ds.ru}`)
      - traefik.http.routers.concord.entrypoints=websecure
      - traefik.http.routers.concord.tls=true
      - traefik.http.routers.concord.tls.certresolver=cloudflare
      - traefik.http.services.concord.loadbalancer.server.port=80
      - traefik.http.routers.concord_http.rule=Host(`${APP_DOMAIN:-c.2ds.ru}`)
      - traefik.http.routers.concord_http.entrypoints=web
      - traefik.http.routers.concord_http.middlewares=redirect-to-https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true
    depends_on:
      - app
    networks:
      - default
      - proxy

  loki:
    image: grafana/loki:3.5.3
    container_name: concord-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    labels:
      logging: concord
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - default

  promtail:
    image: grafana/promtail:3.5.3
    container_name: concord-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ./backend/storage/logs:/var/log/concord/laravel:ro
      - nginx_logs:/var/log/nginx:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      logging: concord
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - default

  frontend:
    image: node:22-bookworm-slim
    container_name: concord-frontend-build
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm ci && npm run build"
    profiles:
      - build
    networks:
      - default

networks:
  proxy:
    external: true

volumes:
  postgres_data:
  nginx_logs:
  loki_data:
