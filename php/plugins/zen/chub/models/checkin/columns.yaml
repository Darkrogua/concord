columns:
    id:
        label: id
        type: number
        sortable: true
    ship:
        label: Теплоход
        type: text
        relation: ship
        valueFrom: name
        sortable: true
    date_start:
        label: Отправление
        type: datetime
        sortable: true
        format: 'd.m.Y H:i'
    date_end:
        label: Прибытие
        type: datetime
        sortable: true
        format: 'd.m.Y H:i'
    route_points_count:
        label: Точек маршрута
        type: number
        sortable: false
        sqlSelect: "(SELECT COUNT(*) FROM zen_chub_checkin_route_points rp WHERE rp.checkin_id = zen_chub_checkins.id)"
    active:
        label: Активно
        type: switch
        sortable: true
    sort_order:
        label: Порядок
        type: number
        sortable: true
    created_at:
        label: Создано
        type: datetime
        sortable: true
        format: 'd.m.Y H:i'
    updated_at:
        label: Обновлено
        type: datetime
        sortable: true
        format: 'd.m.Y H:i'