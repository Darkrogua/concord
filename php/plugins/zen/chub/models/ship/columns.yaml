columns:
    id:
        label: id
        type: number
        sortable: true
    name:
        label: Название
        type: text
        searchable: true
        sortable: true
    ship_class_name:
        label: Класс корабля
        type: text
        sortable: true
        sqlSelect: "(SELECT zen_chub_ship_classes.name FROM zen_chub_ship_classes WHERE zen_chub_ship_classes.id = @ship_class_id LIMIT 1)"
    active:
        label: Активность
        type: switch
        sortable: true
    sort_order:
        label: Порядок
        type: number
        invisible: true
        sortable: true
    created_at:
        label: Создано
        type: datetime
        sortable: true
        format: 'd.m.Y H:i'
    updated_at:
        label: Обновлено
        type: datetime
        sortable: true
        format: 'd.m.Y H:i'
