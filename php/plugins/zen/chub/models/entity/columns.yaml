columns:
    icon:
        label: Иконка
        type: partial
        path: ~/plugins/zen/chub/controllers/entities/_icon_column.php
        width: 50px
        cssClass: text-center
        sortable: false
    id:
        label: id
        type: number
        invisible: true
        sortable: true
    code:
        label: Код
        type: text
        searchable: true
        invisible: true
        sortable: true
    name:
        label: Название
        type: text
        searchable: true
        sortable: true
    active:
        label: Активно
        type: switch
        sortable: true
    sort_order:
        label: Порядок
        type: number
        invisible: true
        sortable: true
    created_at:
        label: Создано
        type: datetime
        invisible: true
        sortable: true
        format: 'd.m.Y H:i'
    updated_at:
        label: Обновлено
        type: datetime
        invisible: true
        sortable: true
        format: 'd.m.Y H:i'
    go_button:
        label: Управление
        type: partial
        path: $/zen/chub/controllers/entities/_go_button_column.php
        width: 100px
        cssClass: text-center nolink
        sortable: false
