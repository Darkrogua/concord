fields:
    id:
        label: ID
        span: full
        type: text
        readOnly: true
        context:
            - update
    name:
        label: Название
        span: left
        type: text
        required: true
    owner_id:
        label: Владелец
        span: right
        type: recordfinder
        modelClass: RainLab\User\Models\User
        nameFrom: full_name
        descriptionFrom: email
        list: $/rainlab/user/models/user/columns.yaml
        recordsPerPage: 10
        title: Выберите пользователя
    description:
        label: Описание
        size: large
        span: full
        type: textarea
    activate_at:
        label: Активация
        span: left
        type: datepicker
        mode: datetime
    stop_at:
        label: Остановка
        span: right
        type: datepicker
        mode: datetime
