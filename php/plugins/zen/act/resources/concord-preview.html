<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="concord-build" content="__CONCORD_BUILD__" />
    <title>Concord — превью главной</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #f8f5ff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        max-width: 100%;
      }
      #concord-app { min-height: 100dvh; max-width: 100%; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      (function () {
        var meta = document.querySelector('meta[name="concord-build"]')
        if (!meta) return
        var expected = meta.getAttribute('content')
        if (!expected || expected === '__CONCORD_BUILD__') return
        fetch('build-id.txt?_=' + Date.now(), { cache: 'no-store' })
          .then(function (res) { return res.ok ? res.text() : '' })
          .then(function (remote) {
            remote = (remote || '').trim()
            if (!remote || remote === expected) return
            var url = new URL(window.location.href)
            url.searchParams.set('cb', remote)
            window.location.replace(url.toString())
          })
          .catch(function () {})
      })()
    </script>
    <div id="concord-app"></div>
    <script type="module" src="/act_app/js/concord_preview.js"></script>
  </body>
</html>
