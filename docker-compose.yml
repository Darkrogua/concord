services:
  postgres:
    image: postgres:16-alpine
    container_name: concord-postgres
    environment:
      POSTGRES_DB: concord
      POSTGRES_USER: concord
      POSTGRES_PASSWORD: concord
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    labels:
      logging: concord
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concord -d concord"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: concord-redis
    ports:
      - "6379:6379"
    labels:
      logging: concord
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ./docker/php
    container_name: concord-app
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php-custom.ini:/usr/local/etc/php/conf.d/zz-concord.ini:ro
    environment:
      APP_ENV: local
    labels:
      logging: concord
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    build:
      context: ./docker/php
    container_name: concord-queue
    volumes:
      - ./backend:/var/www/html
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=120
    labels:
      logging: concord
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ./docker/php
    container_name: concord-scheduler
    volumes:
      - ./backend:/var/www/html
    command: php artisan schedule:work
    labels:
      logging: concord
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: concord-nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/00-json-log.conf:/etc/nginx/conf.d/00-json-log.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    labels:
      logging: concord
    depends_on:
      - app

  mailpit:
    image: axllent/mailpit
    container_name: concord-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    labels:
      logging: concord

  loki:
    image: grafana/loki:3.5.3
    container_name: concord-loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3101:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    labels:
      logging: concord
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  promtail:
    image: grafana/promtail:3.5.3
    container_name: concord-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ./backend/storage/logs:/var/log/concord/laravel:ro
      - nginx_logs:/var/log/nginx:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      logging: concord
    depends_on:
      loki:
        condition: service_healthy

volumes:
  postgres_data:
  nginx_logs:
  loki_data:
