server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["concord-"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_label_logging"]
        target_label: logging
      - replacement: docker
        target_label: job
    pipeline_stages:
      - static_labels:
          project: concord

  - job_name: laravel
    static_configs:
      - targets: [localhost]
        labels:
          job: laravel
          service: app
          project: concord
          __path__: /var/log/concord/laravel/laravel.json*.log
    pipeline_stages:
      - json:
          expressions:
            message: message
            level: level_name
            channel: channel
            datetime: datetime
            extra: extra
      - labels:
          level:
          channel:
      - output:
          source: message

  - job_name: nginx
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          service: nginx
          project: concord
          __path__: /var/log/nginx/access.json
    pipeline_stages:
      - match:
          selector: '{filename=~".*access.json"}'
          stages:
            - json:
                expressions:
                  method:
                  uri:
                  status:
                  request_time:
                  remote_addr:
            - labels:
                method:
                status:
            - output:
                source: uri
