; PHP Custom Configuration for OctoberCMS
; Memory and performance settings

; Memory limit - increased for OctoberCMS updates and operations
memory_limit = 512M

; File upload settings
upload_max_filesize = 100M
post_max_size = 100M

; Execution time
max_execution_time = 300
max_input_time = 300

; Other performance settings
max_input_vars = 5000
