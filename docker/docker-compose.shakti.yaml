# Production stack OS3 на Shakti VPS (/opt/os3).
# Traefik: /srv/docker/traefik (сеть traefik, Let's Encrypt).
# Запуск: docker compose --env-file .env.shakti -f docker-compose.shakti.yaml up -d

name: os3-shakti

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"
    compress: "true"

x-os3-env: &os3-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://${APP_DOMAIN}
  APP_LOCALE: ru
  APP_FALLBACK_LOCALE: ru
  ACTIVE_THEME: os3
  BACKEND_URI: console
  BACKEND_TURBO_ROUTER: "false"
  CMS_ROUTE_CACHE: "false"
  CMS_ASSET_CACHE: "false"
  CMS_SAFE_MODE: "false"
  DB_CONNECTION: pgsql
  DB_HOST: os3-db
  DB_PORT: "5432"
  DB_DATABASE: ${POSTGRES_DB}
  DB_USERNAME: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  LOG_CHANNEL: single
  CACHE_STORE: file
  QUEUE_CONNECTION: sync
  SESSION_DRIVER: file
  SESSION_LIFETIME: "120"
  SESSION_SECURE_COOKIE: "true"
  SESSION_SAME_SITE: none
  TZ: ${TZ}

x-os3-build: &os3-build
  context: ./app
  dockerfile: Dockerfile
  args:
    UID: ${UID:-1000}
    GID: ${GID:-1000}

services:
  os3-db:
    image: postgres:16-alpine
    container_name: os3-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - os3_db_data:/var/lib/postgresql/data
    networks:
      - os3_internal

  os3-php:
    build: *os3-build
    container_name: os3-php
    restart: unless-stopped
    working_dir: /var/www/html
    user: "${UID:-1000}:${GID:-1000}"
    logging: *default-logging
    volumes:
      - ../php:/var/www/html
    environment: *os3-env
    depends_on:
      os3-db:
        condition: service_healthy
    networks:
      - os3_internal

  os3-scheduler:
    build: *os3-build
    container_name: os3-scheduler
    init: true
    restart: unless-stopped
    working_dir: /var/www/html
    user: "${UID:-1000}:${GID:-1000}"
    logging: *default-logging
    volumes:
      - ../php:/var/www/html
    environment: *os3-env
    command: ["supercronic", "/var/www/html/.scheduler/crontab"]
    depends_on:
      os3-db:
        condition: service_healthy
    networks:
      - os3_internal

  os3-node:
    profiles: ["build"]
    image: node:20-alpine
    container_name: os3-vite-build
    working_dir: /var/www/html
    user: "${UID:-1000}:${GID:-1000}"
    logging: *default-logging
    volumes:
      - ../php:/var/www/html
    networks:
      - os3_internal

  os3-nginx:
    image: nginx:stable-alpine
    container_name: os3-nginx
    restart: unless-stopped
    depends_on:
      - os3-php
    logging: *default-logging
    volumes:
      - ../php:/var/www/html:ro
      - ./web/nginx.shakti.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - os3_internal
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.os3acts-http.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.os3acts-http.entrypoints=web
      - traefik.http.routers.os3acts-http.middlewares=redirect-to-https
      - traefik.http.routers.os3acts.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.os3acts.entrypoints=websecure
      - traefik.http.routers.os3acts.tls=true
      - traefik.http.routers.os3acts.tls.certresolver=le
      - traefik.http.services.os3acts.loadbalancer.server.port=8083
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true

volumes:
  os3_db_data:
    name: os3_shakti_db_data

networks:
  os3_internal:
    name: os3_shakti_internal
    driver: bridge
  traefik:
    external: true
