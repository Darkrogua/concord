server {
    listen 80;
    server_name _;
    client_max_body_size 60M;

    root /var/www/frontend;
    index index.html;

    access_log /var/log/nginx/access.json json;
    error_log /var/log/nginx/error.log warn;

    location ^~ /storage/ {
        alias /var/www/html/public/storage/;
        try_files $uri =404;
    }

    location ^~ /css/filament/ {
        alias /var/www/html/public/css/filament/;
    }

    location ^~ /js/filament/ {
        alias /var/www/html/public/js/filament/;
    }

    location ^~ /fonts/filament/ {
        alias /var/www/html/public/fonts/filament/;
    }

    location ~ ^/(api|sanctum|admin|livewire|up)(/|$) {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS on;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
