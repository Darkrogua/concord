server {
  listen 8083;
  server_name acts.os3.pro;
  root /var/www/html;
  index index.php index.html;

  client_max_body_size 16m;

  # Docker DNS: не кэшировать IP os3-php при пересоздании контейнера
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $php_upstream os3-php:9000;

  location ^~ /app {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_pass $php_upstream;
    fastcgi_read_timeout 120s;
  }

  location ~ ^/act_[0-9a-fA-F-]\{36\}$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_pass $php_upstream;
    fastcgi_read_timeout 120s;
  }

  location = /plugins/zen/act/assets/sw.js {
    add_header Service-Worker-Allowed /;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location ~ \.php$ {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass $php_upstream;
    fastcgi_read_timeout 120s;
  }

  location ^~ /assets/build/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf)$ {
    expires max;
    access_log off;
  }
}
