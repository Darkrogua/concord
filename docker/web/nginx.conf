server {
  listen 8083;
  server_name os3.megan os3 localhost;
  root /var/www/html;
  index index.php index.html;

  client_max_body_size 16m;

  # Zen.Act SPA: /app и /act_{uuid} — иначе /app попадает в каталог Laravel → 403
  location ^~ /app {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_pass os3-php:9000;
    fastcgi_read_timeout 120s;
  }

  location ~ ^/act_[0-9a-fA-F-]\{36\}$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_pass os3-php:9000;
    fastcgi_read_timeout 120s;
  }

  # Zen.Act PWA: service worker в подкаталоге assets, scope на весь сайт
  location = /plugins/zen/act/assets/sw.js {
    add_header Service-Worker-Allowed /;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Обработка файлов с fallback на OctoberCMS
  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  # PHP обработка
  location ~ \.php$ {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass os3-php:9000;
    fastcgi_read_timeout 120s;
  }

  # Vite dev server proxy (после настройки путей к плагину/теме)
  # location ^~ /@vite/ {
  #   proxy_pass http://os3-node:5173/@vite/;
