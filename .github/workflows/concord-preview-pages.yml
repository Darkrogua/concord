name: Concord preview (GitHub Pages)

on:
  push:
    branches:
      - main
      - master
      - john

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: concord-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: php/plugins/zen/act/package-lock.json

      - name: Install dependencies
        working-directory: php/plugins/zen/act
        run: npm ci

      - name: Build static preview
        working-directory: php/plugins/zen/act
        env:
          CONCORD_PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build:concord:pages

      - name: Add index.html
        working-directory: php/plugins/zen/act/dist/concord-pages
        run: cp concord-preview.html index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: php/plugins/zen/act/dist/concord-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
