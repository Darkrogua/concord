name: Concord preview (GitHub Pages)

on:
  push:
    branches:
      - main
      - master
      - john
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: concord-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: php/plugins/zen/act/package-lock.json

      - name: Install dependencies
        working-directory: php/plugins/zen/act
        run: npm ci

      - name: Build static preview
        working-directory: php/plugins/zen/act
        env:
          CONCORD_PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build:concord:pages

      - name: Add index.html and cache-bust assets
        working-directory: php/plugins/zen/act/dist/concord-pages
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          if [ ! -f index.html ]; then
            cp concord-preview.html index.html
          fi
          SHORT_SHA="${BUILD_SHA:0:7}"
          echo "$SHORT_SHA" > build-id.txt
          for file in index.html concord-preview.html; do
            perl -pi -e "s/__CONCORD_BUILD__/${SHORT_SHA}/g" "$file"
            perl -pi -e "s/(concord-preview-[^\"?]+\.(?:js|css))/\$1?v=${SHORT_SHA}/g" "$file"
            perl -pi -e "s/(index-[^\"?]+\.(?:js|css))/\$1?v=${SHORT_SHA}/g" "$file"
          done

      - uses: actions/upload-pages-artifact@v4
        with:
          path: php/plugins/zen/act/dist/concord-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
